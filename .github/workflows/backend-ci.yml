name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop


jobs:
  backend-quality:
    name: Backend Quality

    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aios_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d aios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    defaults:
      run:
        working-directory: backend


    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aios_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aios_test

      JWT_SECRET_KEY: ci-test-secret-not-for-production

      OPENAI_API_KEY: ""


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

          cache: pip

          cache-dependency-path: backend/requirements.txt


          - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit==2.9.0

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Verify PostgreSQL
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["TEST_DATABASE_URL"]
          )

          with engine.begin() as connection:
              version = connection.execute(
                  text("SELECT version()")
              ).scalar_one()

              connection.execute(
                  text(
                      "CREATE EXTENSION IF NOT EXISTS vector"
                  )
              )

              vector_version = connection.execute(
                  text(
                      """
                      SELECT extversion
                      FROM pg_extension
                      WHERE extname = 'vector'
                      """
                  )
              ).scalar_one()

          print(version)
          print(
              f"pgvector extension: {vector_version}"
          )
          PY
      - name: Verify Alembic migrations
        run: |
          alembic upgrade head
          alembic current


      - name: Run Ruff auto-fix check
        run: |
          ruff check app tests --fix


      - name: Verify no Ruff violations remain
        run: |
          ruff check app tests


      - name: Run tests
        run: |
          pytest -v
